<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discord Lookup</title>
  <style>
    :root {
      --bg: #0d0f13;
      --card: #161b22;
      --border: #30363d;
      --accent: #5865f2;
      --accent-hover: #4752c4;
      --text: #e6edf3;
      --muted: #8b949e;
      --green: #3fb950;
      --red: #f85149;
      --yellow: #d29922;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header h1 span { color: var(--accent); }

    header p {
      color: var(--muted);
      margin-top: 8px;
      font-size: 0.95rem;
    }

    .search-box {
      width: 100%;
      max-width: 600px;
      display: flex;
      gap: 10px;
      margin-bottom: 32px;
    }

    .search-box input {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 18px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus { border-color: var(--accent); }
    .search-box input::placeholder { color: var(--muted); }

    .search-box button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .search-box button:hover { background: var(--accent-hover); }
    .search-box button:disabled { opacity: 0.5; cursor: not-allowed; }

    #sonuc { width: 100%; max-width: 700px; }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-green { background: rgba(63,185,80,0.15); color: var(--green); }
    .badge-red   { background: rgba(248,81,73,0.15);  color: var(--red);   }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 16px;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .card-header h3 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent);
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }

    .field {
      background: rgba(255,255,255,0.04);
      border-radius: 8px;
      padding: 12px 14px;
    }

    .field-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .field-value {
      font-size: 0.9rem;
      word-break: break-all;
      color: var(--text);
    }

    .field-value.secret {
      filter: blur(5px);
      transition: filter 0.3s;
      cursor: pointer;
    }

    .field-value.secret:hover { filter: none; }

    .not-found {
      text-align: center;
      padding: 40px;
    }

    .not-found .icon { font-size: 3rem; margin-bottom: 12px; }
    .not-found h2 { font-size: 1.3rem; margin-bottom: 8px; }
    .not-found p { color: var(--muted); }

    .summary-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .summary-bar .id-text {
      font-family: monospace;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .loader {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }

    .loader span {
      display: inline-block;
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      margin: 0 3px;
      animation: bounce 1s infinite;
    }

    .loader span:nth-child(2) { animation-delay: 0.15s; }
    .loader span:nth-child(3) { animation-delay: 0.3s;  }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1.1); opacity: 1; }
    }

    footer {
      margin-top: 60px;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <h1>Discord <span>Lookup</span></h1>
  <p>Discord ID ile kullanıcı bilgisi sorgula</p>
</header>

<div class="search-box">
  <input
    id="idInput"
    type="text"
    placeholder="Discord ID gir... (örn: 1210275552485707849)"
    inputmode="numeric"
    autocomplete="off"
  />
  <button id="sorguBtn" onclick="sorgula()">Sorgula</button>
</div>

<div id="sonuc"></div>

<footer>Discord Lookup API v1.0</footer>

<script>
  // ── Buraya kendi API adresini yaz ──────────────────────────
  const API_BASE = "https://YOUR-API-URL.com";
  // ───────────────────────────────────────────────────────────

  const gizliAlanlar = ["ip", "email", "ip adresi", "e-posta"];

  document.getElementById("idInput").addEventListener("keydown", e => {
    if (e.key === "Enter") sorgula();
  });

  async function sorgula() {
    const id = document.getElementById("idInput").value.trim();
    const btn = document.getElementById("sorguBtn");
    const div = document.getElementById("sonuc");

    if (!id || !/^\d+$/.test(id)) {
      div.innerHTML = mesajKart("⚠️ Lütfen geçerli bir Discord ID gir (sadece rakam).", "yellow");
      return;
    }

    btn.disabled = true;
    div.innerHTML = `<div class="loader"><span></span><span></span><span></span><p style="margin-top:16px">Sorgulanıyor...</p></div>`;

    try {
      const res = await fetch(`${API_BASE}/api/v1/${id}`);
      const data = await res.json();

      if (res.status === 404 || data.status === "not_found") {
        div.innerHTML = `
          <div class="card not-found">
            <div class="icon">🔍</div>
            <h2>Kayıtsız Kullanıcı</h2>
            <p>Bu ID veritabanında <strong>bulunamadı</strong>.</p>
            <p style="margin-top:8px;font-family:monospace;font-size:.85rem;color:#8b949e">${id}</p>
          </div>`;
        return;
      }

      if (data.status === "success") {
        let html = `
          <div class="summary-bar">
            <span class="badge badge-green">✓ Bulundu</span>
            <span class="id-text">${id}</span>
            <span class="badge" style="background:rgba(88,101,242,.15);color:#7289da">
              ${data.toplam_kaynak} kaynak
            </span>
          </div>`;

        for (const kayit of data.kayitlar) {
          const alanlar = Object.entries(kayit).filter(([k]) => k !== "kaynak");
          html += `
            <div class="card">
              <div class="card-header">
                <span>🗂️</span>
                <h3>${escHtml(kayit.kaynak || "Bilinmiyor")}</h3>
              </div>
              <div class="field-grid">
                ${alanlar.map(([k, v]) => {
                  const gizli = gizliAlanlar.some(g => k.toLowerCase().includes(g));
                  return `
                    <div class="field">
                      <div class="field-label">${escHtml(k)}</div>
                      <div class="field-value${gizli ? " secret" : ""}" title="${gizli ? "Görmek için tıkla" : ""}">
                        ${escHtml(String(v))}
                      </div>
                    </div>`;
                }).join("")}
              </div>
            </div>`;
        }

        div.innerHTML = html;
        return;
      }

      div.innerHTML = mesajKart("Beklenmedik bir hata oluştu.", "red");

    } catch (err) {
      div.innerHTML = mesajKart(`API'ye bağlanılamadı: ${err.message}`, "red");
    } finally {
      btn.disabled = false;
    }
  }

  function mesajKart(metin, renk) {
    const renkler = {
      red:    "rgba(248,81,73,.1)",
      yellow: "rgba(210,153,34,.1)",
    };
    return `<div class="card" style="background:${renkler[renk]||''}; text-align:center; padding:30px;">
              <p>${metin}</p></div>`;
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
</script>

</body>
</html>
